# Production overlay. Run together with docker-compose.yml on the VPS:
# docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d --build
#
# The Traefik network must already exist because it belongs to the shared
# reverse-proxy stack, for example: docker network create traefik
services:
  frontend:
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.services.battle-arena.loadbalancer.server.port=80"

      # HTTPS router for arena.navit.com.br. Traefik forwards WebSocket
      # upgrades automatically, so /ws/arena/* uses this same router.
      - "traefik.http.routers.battle-arena.rule=Host(`${BATTLE_DOMAIN:-arena.navit.com.br}`)"
      - "traefik.http.routers.battle-arena.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.battle-arena.tls=true"
      - "traefik.http.routers.battle-arena.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}"
      - "traefik.http.routers.battle-arena.service=battle-arena"

      # Send accidental HTTP traffic to HTTPS. Set TRAEFIK_HTTP_ENTRYPOINT to
      # the entrypoint name used by the existing Traefik installation.
      - "traefik.http.routers.battle-arena-http.rule=Host(`${BATTLE_DOMAIN:-arena.navit.com.br}`)"
      - "traefik.http.routers.battle-arena-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.battle-arena-http.middlewares=battle-arena-https"
      - "traefik.http.middlewares.battle-arena-https.redirectscheme.scheme=https"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
