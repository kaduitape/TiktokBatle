server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to the API through the same public origin.  This
    # avoids a hard-coded localhost address in the built frontend and keeps
    # the backend, Redis and PostgreSQL off the public network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # FastAPI's interactive documentation fetches /openapi.json from the
    # same origin, so expose the documentation endpoints through this proxy.
    location = /docs {
        proxy_pass http://backend:8000;
    }

    location = /redoc {
        proxy_pass http://backend:8000;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
