name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tiktokbatle-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Update and restart the VPS stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            app_dir=/docker/tiktokbatle

            test -f "$app_dir/.env"
            cd "$app_dir"
            git fetch --prune origin master
            git checkout --force master
            git reset --hard origin/master
            # The public Arena only works when its frontend has the Traefik
            # labels from this overlay. Production is this Hostinger VPS, so
            # do not let an old COMPOSE_OVERLAY setting choose a different
            # compose definition or silently skip public routing.
            test -f docker-compose.hostinger.yml
            files="-f docker-compose.yml -f docker-compose.hostinger.yml"
            # Passing -f at all turns off the override file Compose would
            # otherwise load by itself. That file is not in Git -- it is where
            # per-server configuration lives -- so dropping it silently would
            # undo whatever the server was configured with.
            if [ -f docker-compose.override.yml ]; then
              files="$files -f docker-compose.override.yml"
              echo "incluindo docker-compose.override.yml"
            fi

            echo "compose de producao: ${files}"

            docker compose --env-file .env $files up --build --detach --remove-orphans
            # Labels are applied when a container is created. Recreate only
            # the stateless frontend so a previous unlabeled container cannot
            # survive a successful code deploy; leave the database untouched.
            docker compose --env-file .env $files up --detach --force-recreate frontend
            docker compose --env-file .env $files ps

            # Fail the deploy here rather than letting the domain 404 quietly.
            expected_domain="arena.navit.com.br"
            expected_rule='Host(`arena.navit.com.br`)'
            frontend="$(docker compose --env-file .env $files ps -q frontend)"
            enabled="$(docker inspect --format '{{ index .Config.Labels "traefik.enable" }}' "$frontend")"
            rule="$(docker inspect --format '{{ index .Config.Labels "traefik.http.routers.battle-arena.rule" }}' "$frontend")"
            echo "frontend=${frontend} traefik.enable=${enabled} router.rule=${rule}"
            if [ "$enabled" != "true" ] || [ "$rule" != "$expected_rule" ]; then
              echo "frontend subiu sem o roteamento esperado do Traefik -- o dominio vai responder 404"
              exit 1
            fi
            echo "frontend rotulado para o Traefik: ok"
            curl --fail --silent --show-error \
              --resolve "${expected_domain}:443:127.0.0.1" \
              "https://${expected_domain}/" >/dev/null
            echo "Traefik respondeu pela rota publica: ok"
