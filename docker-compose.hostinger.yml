# Overlay for Hostinger Docker Manager's built-in Traefik installation.
#
# On this VPS Traefik uses `network_mode: host`, so it must NOT be attached
# to an external Docker network. The Docker provider can still reach the
# frontend through the host bridge and discovers these labels directly.
services:
  frontend:
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.battle-arena.loadbalancer.server.port=80"
      # This is the public hostname for this Hostinger stack. Keep it explicit
      # so a stale value in the VPS .env cannot register a router for a
      # different hostname while arena.navit.com.br responds with Traefik 404.
      - "traefik.http.routers.battle-arena.rule=Host(`arena.navit.com.br`)"
      # The VPS Traefik exposes HTTPS through `websecure`. Do not read this
      # from .env: an old value such as `web` registers the router only on
      # port 80 and makes the public HTTPS domain return Traefik's 404.
      - "traefik.http.routers.battle-arena.entrypoints=websecure"
      - "traefik.http.routers.battle-arena.tls=true"
      - "traefik.http.routers.battle-arena.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.battle-arena.service=battle-arena"
